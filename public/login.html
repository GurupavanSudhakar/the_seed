<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Log In — The Seed Chronicles</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/chapter-themes.css">
</head>
<body data-theme="meadow">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
function showLoginScreen(){
  clearScreens();
  showScreen(`
    <h1 style="margin-bottom:24px">Welcome back 🌱</h1>
    <form class="auth-form" id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <div class="error" id="loginError"></div>
      <button class="btn" type="submit">Log In</button>
    </form>
    <p class="switch-link">No account yet? <a href="/signup">Sign up with an invite code</a></p>
  `);
  wireLoginForm();
}
showLoginScreen();
</script>
</body>
</html>
