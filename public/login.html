<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Log In — The Seed Chronicles</title>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/chapter-themes.css">
<style>
/* Login-screen-only rules — single-page use, not worth sharing into shared.css. */

.login-bg{
  position:absolute;inset:0;
  background-image:url('assets/login/login-bg.png');
  background-size:cover;
  background-position:center;
  z-index:0;
}

.login-title{
  position:absolute;
  top:6%;left:0;right:0;
  z-index:2;
  font-family:'Metamorphous',serif;
  font-weight:700;
  font-size:clamp(1.4rem, 5.2vw, 2.6rem);
  letter-spacing:1px;
  color:var(--accent-sun);
  -webkit-text-stroke:0.5px var(--accent-sun);
  text-align:center;
  white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,0.8), 0 0 24px rgba(0,0,0,0.5);
}

.login-form{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.login-form input{
  width:min(300px, 78vw);
  padding:15px 18px;
  border-radius:12px;
  border:1px solid rgba(240,199,85,0.35);
  background:var(--panel);
  backdrop-filter:blur(6px);
  color:var(--text-dark);
  font-size:1rem;font-family:inherit;
  box-shadow:0 4px 18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(240,199,85,0.06);
  transition:border-color 0.2s, box-shadow 0.2s;
}
.login-form input::placeholder{ color:rgba(245,233,200,0.45); }
.login-form input:focus{
  outline:none;
  border-color:var(--accent-sun);
  box-shadow:0 4px 18px rgba(0,0,0,0.45), 0 0 14px rgba(240,199,85,0.45);
}

.login-submit{
  width:min(300px, 78vw);
  padding:15px 18px;
  border-radius:12px;
  border:1px solid rgba(240,199,85,0.5);
  background:#211a0c;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:1.1rem;
  color:var(--accent-sun);
  text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.5);
  transition:transform 0.12s, box-shadow 0.2s;
  -webkit-user-select:none;user-select:none;
}
.login-submit:hover{ box-shadow:0 6px 16px rgba(0,0,0,0.5), 0 0 14px rgba(240,199,85,0.6); }
.login-submit:active{ transform:scale(0.96); box-shadow:0 6px 16px rgba(0,0,0,0.5), 0 0 18px rgba(240,199,85,0.75); }

.login-signup-link{
  width:min(300px, 78vw);
  padding:10px 18px;
  border:none;
  background:none;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:0.9rem;
  color:rgba(245,233,200,0.75);
  text-align:center;
  text-decoration:underline;
  text-underline-offset:3px;
  -webkit-user-select:none;user-select:none;
}
.login-signup-link:hover{ color:var(--accent-sun); }

.login-form .error{
  position:absolute;
  top:100%;left:0;right:0;
  margin-top:8px;
  color:#ff8a7a;
  font-size:0.85rem;
  text-align:center;
}
</style>
</head>
<body data-theme="login">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
function showLoginScreen(){
  clearScreens();
  showScreen(`
    <div class="login-bg"></div>
    <h1 class="login-title">THE CALL HAS BEEN ANSWERED.</h1>
    <form class="login-form" id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <div class="error" id="loginError"></div>
      <button class="login-submit" type="submit">AWAKEN</button>
      <button class="login-signup-link" type="button" id="signupLinkBtn">Haven't signed up yet?</button>
    </form>
  `);
  wireLoginForm();
  $('signupLinkBtn').onclick = () => location.href = '/signup';
}
showLoginScreen();
</script>
</body>
</html>
