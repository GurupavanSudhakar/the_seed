<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Title Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/chapter-themes.css">
<style>
/* Title-screen-only rules — single-page use, not worth sharing into shared.css. */

.screen.no-fade-bg{
  padding:0;
}
.title-bg{
  position:absolute;inset:0;
  background-image:url('assets/title/titlescreen_background.png');
  background-size:cover;
  background-position:center 40%;
  z-index:0;
}
.title-vignette{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.05) 40%,rgba(0,0,0,0.35) 100%),
             linear-gradient(90deg,rgba(0,0,0,0.25) 0%,transparent 35%);
  z-index:1;
}
.title-content{
  position:relative;
  z-index:2;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:flex-end;
  justify-content:flex-start;
  padding:18px 0 18px 8px;
}
.logo-block{
  text-align:right;
  margin-top:95px;
  padding-right:60px;
}
.logo-block .game-title{
  font-family:'Cormorant Garamond',serif;
  font-size:3rem;
  font-weight:700;
  color:#fdf6e3;
  text-shadow:0 2px 6px rgba(0,0,0,0.7), 0 0 24px rgba(0,0,0,0.4);
  letter-spacing:1px;
  line-height:1.1;
  font-style:italic;
}
.logo-block .game-title .accent{
  color:#FFD966;
}
.menu-block{
  margin-top:65px;
  margin-bottom:40px;
  text-align:right;
  display:flex;flex-direction:column;
  gap:19px;
  align-items:flex-end;
  padding-right:120px;
}
.menu-item{
  font-size:calc(1.1rem + 9px);
  font-style:italic;
  font-weight:700;
  color:#fdf6e3;
  opacity:0.85;
  text-shadow:0 2px 6px rgba(0,0,0,0.8);
  cursor:pointer;
  background:none;border:none;
  font-family:'Cormorant Garamond',serif;
  display:flex;align-items:center;gap:10px;
  transition:color 0.2s, transform 0.15s;
  -webkit-user-select:none;user-select:none;
}
.menu-item .arrow{
  opacity:0;
  transition:opacity 0.2s, transform 0.2s;
  transform:translateX(4px);
}
.menu-item:hover .arrow, .menu-item:active .arrow{
  opacity:1;
  transform:translateX(0);
}
.menu-item:hover, .menu-item:active{
  color:#FFD966;
}
.menu-item.primary{
  font-size:calc(1.2rem + 9px);
}
.logo-image{
  width:clamp(214.5px, 33.15vw, 370.5px);
  height:auto;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.5));
}
</style>
</head>
<body data-theme="meadow">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/supabase-client.js"></script>
<script>
// ===== Title Screen (Zelda BOTW style) =====
function showTitleScreen(){
  clearScreens();
  const s = showScreen(`
    <div class="title-bg"></div>
    <div class="title-vignette"></div>
    <div class="title-content">
      <div class="logo-block">
        <img class="logo-image" src="assets/title/seed_logo.png" alt="The Seed Chronicles logo">
      </div>
      <div class="menu-block">
        <button class="menu-item primary" id="playBtn"><span class="arrow">➤</span> Play</button>
        <button class="menu-item" id="chapterSelectBtn"><span class="arrow">➤</span> Chapter Select</button>
        <button class="menu-item" id="creditsBtn"><span class="arrow">➤</span> Credits</button>
        <button class="menu-item" id="storySourceBtn"><span class="arrow">➤</span> Story Source</button>
      </div>
    </div>
  `, 'no-fade-bg');

  s.querySelector('#playBtn').onclick = () => {
    location.href = '/chapter1';
  };
  s.querySelector('#chapterSelectBtn').onclick = () => {
    // Placeholder: chapter select to be built later
  };
  s.querySelector('#creditsBtn').onclick = () => {
    location.href = '/credits';
  };
  s.querySelector('#storySourceBtn').onclick = () => {
    location.href = '/story-source';
  };
}

// Start — wait for shared.js's async lock check (it redirects to /signup if
// LOCKED), then gate the title screen on an active session.
(async () => {
  await lockReady;
  if (LOCKED) return;
  if (isPageLocked('/')) {
    showLockedScreen();
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    location.replace('/login');
    return;
  }
  showTitleScreen();
})();
</script>
</body>
</html>
