<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/chapter-themes.css">
<style>
/* Signup-screen-only rules — single-page use, not worth sharing into shared.css. */

.signup-bg{
  position:absolute;inset:0;
  background-image:url('assets/signup/signup-bg.png');
  background-size:cover;
  background-position:center;
  z-index:0;
}

.signup-title{
  position:absolute;
  top:6%;left:0;right:0;
  z-index:2;
  font-family:'Metamorphous',serif;
  font-weight:400;
  font-size:clamp(1.4rem, 5.2vw, 2.6rem);
  letter-spacing:1px;
  color:var(--accent-sun);
  text-align:center;
  white-space:nowrap;
  text-shadow:0 2px 8px rgba(0,0,0,0.8), 0 0 24px rgba(0,0,0,0.5);
}

.signup-form{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.signup-form input{
  width:min(300px, 78vw);
  padding:15px 18px;
  border-radius:12px;
  border:1px solid rgba(240,199,85,0.35);
  background:var(--panel);
  backdrop-filter:blur(6px);
  color:var(--text-dark);
  font-size:1rem;font-family:inherit;
  box-shadow:0 4px 18px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(240,199,85,0.06);
  transition:border-color 0.2s, box-shadow 0.2s;
}
.signup-form input::placeholder{ color:rgba(245,233,200,0.45); }
.signup-form input:focus{
  outline:none;
  border-color:var(--accent-sun);
  box-shadow:0 4px 18px rgba(0,0,0,0.45), 0 0 14px rgba(240,199,85,0.45);
}

.signup-submit{
  width:min(300px, 78vw);
  padding:15px 18px;
  border-radius:12px;
  border:1px solid rgba(240,199,85,0.5);
  background:#211a0c;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  font-size:1.1rem;
  color:var(--accent-sun);
  text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.5);
  transition:transform 0.12s, box-shadow 0.2s;
  -webkit-user-select:none;user-select:none;
}
.signup-submit:hover{ box-shadow:0 6px 16px rgba(0,0,0,0.5), 0 0 14px rgba(240,199,85,0.6); }
.signup-submit:active{ transform:scale(0.96); box-shadow:0 6px 16px rgba(0,0,0,0.5), 0 0 18px rgba(240,199,85,0.75); }

.signup-form .error{
  position:absolute;
  top:100%;left:0;right:0;
  margin-top:8px;
  color:#ff8a7a;
  font-size:0.85rem;
  text-align:center;
}

.signup-success{
  position:relative;z-index:2;
  max-width:min(340px, 78vw);
  margin:0 auto;
  color:var(--text-dark);
  font-size:1.05rem;
  line-height:1.5;
  text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,0.6);
}
</style>
</head>
<body data-theme="signup">
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script>
function showSignupScreen(){
  clearScreens();
  showScreen(`
    <div class="signup-bg"></div>
    <h1 class="signup-title">DO YOU ANSWER THE CALL OF THE SEED?</h1>
    <form class="signup-form" id="signupForm">
      <input type="text" id="signupInviteCode" placeholder="Invite code" required autocomplete="off">
      <input type="text" id="signupUsername" placeholder="Username" required autocomplete="username">
      <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password">
      <div class="error" id="signupError"></div>
      <button class="signup-submit" type="submit">Confirm</button>
    </form>
  `);
  wireSignupForm(showSignupSuccess);
}

function showSignupSuccess(){
  clearScreens();
  showScreen(`
    <div class="signup-bg"></div>
    <h1 class="signup-title">THE SEED HAS TAKEN ROOT.</h1>
    <p class="signup-success">Your account is ready. Wait for the link to the game, then log in there to play.</p>
  `);
}
showSignupScreen();
</script>
</body>
</html>
